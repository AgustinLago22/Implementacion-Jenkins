<!doctype html>
<!--
  Animación explicativa para el video (paso 10e): la parte teórica de la presentación.
  Abrir con doble clic en el navegador (necesita internet: three.js se carga de un CDN).
  Controles: Espacio / → avanzar · ← volver · 1–7 ir a una escena · R reiniciar escena
             H ocultar ayuda (para grabar limpio) · F pantalla completa
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola Mundo CI/CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #eef2f8;
    --texto: #1b2540;
    --tenue: #5b6785;
    --azul: #2f7cf6;
    --bien: #22b573;
    --mal: #e5484d;
    --tarjeta: rgba(255, 255, 255, .92);
    --borde: #d5ddeb;
    --sombra: 0 10px 30px rgba(27, 37, 64, .12);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto); font-family: Inter, system-ui, sans-serif; }
  canvas { display: block; }
  #etiquetas { position: fixed; inset: 0; pointer-events: none; }

  /* Degradado inferior: asegura que la leyenda se lea aunque haya objetos detrás */
  #degradado { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(to bottom, rgba(238, 242, 248, 0), rgba(238, 242, 248, .94)); }

  /* Leyenda: el título grande de cada momento */
  #leyenda {
    position: fixed; left: 50%; bottom: 5.5vh; transform: translateX(-50%);
    width: min(1100px, 90vw); text-align: center; pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
  }
  #leyenda.oculta { opacity: 0; transform: translate(-50%, 10px); }
  #leyenda h1 { margin: 0 0 .3em; font-size: clamp(26px, 3.3vw, 50px); font-weight: 800; letter-spacing: -.02em; }
  #leyenda h1 em { font-style: normal; color: var(--azul); }
  #leyenda p { margin: 0; font-size: clamp(16px, 1.6vw, 25px); color: var(--tenue); }
  body.portada #leyenda { bottom: 50%; transform: translate(-50%, 50%); }
  body.portada #leyenda.oculta { transform: translate(-50%, calc(50% + 10px)); }
  body.portada #leyenda h1 { font-size: clamp(38px, 6vw, 96px); }
  /* Portada "arriba": el título va en el tercio superior y deja libre la escena de abajo */
  body.portada.arriba #leyenda { top: 8vh; bottom: auto; transform: translateX(-50%); }
  body.portada.arriba #leyenda.oculta { transform: translate(-50%, -10px); }
  #leyenda .integrantes { display: none; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 1.3em; }
  #leyenda .integrantes.visible { display: flex; }
  #leyenda .integrantes div {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; box-shadow: var(--sombra);
    padding: 9px 18px; font-size: clamp(14px, 1.3vw, 21px); font-weight: 600;
  }
  #leyenda .integrantes span { margin-left: 8px; font-weight: 400; color: var(--tenue); }

  /* Panel lateral con la teoría de cada momento */
  #panel {
    position: fixed; left: 4vw; top: 42%; transform: translateY(-50%);
    width: min(31vw, 470px); padding: 26px 30px 22px; box-sizing: border-box;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 20px;
    box-shadow: var(--sombra); backdrop-filter: blur(8px);
    transition: opacity .45s ease, transform .45s ease;
  }
  #panel.oculto { opacity: 0; transform: translate(-18px, -50%); }
  #panel h2 { margin: 0 0 14px; font-size: clamp(18px, 1.5vw, 26px); font-weight: 800; letter-spacing: -.01em; color: var(--azul); }
  #panel ul { margin: 0; padding: 0; list-style: none; }
  #panel li {
    position: relative; padding-left: 20px; margin-bottom: 11px;
    font-size: clamp(14px, 1.12vw, 20px); line-height: 1.38;
    opacity: 0; transform: translateX(-8px); animation: entrar .5s ease forwards;
  }
  #panel li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--azul); }
  code { font-family: "JetBrains Mono", monospace; font-size: .88em; background: #eaf1fe; color: #1f5fc4; padding: 1px 6px; border-radius: 5px; }
  @keyframes entrar { to { opacity: 1; transform: none; } }

  /* Etiquetas que siguen a los objetos 3D */
  .etiqueta {
    font: 600 16px/1.2 Inter, sans-serif; color: var(--texto); text-align: center; white-space: nowrap;
    background: var(--tarjeta); border: 1px solid var(--borde); box-shadow: 0 4px 14px rgba(27, 37, 64, .1);
    padding: 6px 11px; border-radius: 9px;
    transition: border-color .3s, background .3s, opacity .4s;
  }
  .etiqueta span { display: block; font-weight: 400; font-size: 12px; color: var(--tenue); }
  .etiqueta.mal { border-color: var(--mal); background: #fff1f2; }
  .etiqueta.bien { border-color: var(--bien); background: #effbf4; }
  .etiqueta.codigo { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 13px; }
  .etiqueta.codigo b { color: var(--azul); }
  .etiqueta.mini { font-size: 12px; padding: 3px 8px; }
  .etiqueta.mini span { font-size: 11px; }
  .etiqueta.pulso { animation: pulso 1.1s ease-in-out infinite; }
  .etiqueta.destello { animation: destello .9s ease; }
  /* Sin transform: las etiquetas 3D usan transform para posicionarse y la animación lo pisaría. */
  @keyframes pulso { 50% { box-shadow: 0 0 0 9px rgba(229, 72, 77, .18); } }
  @keyframes destello { 30% { background: #dff7ea; border-color: var(--bien); box-shadow: 0 0 0 9px rgba(34, 181, 115, .2); } }

  /* Barra de stages, como la vista de Jenkins */
  .etapas { display: flex; align-items: center; gap: 6px; font: 600 13px Inter, sans-serif;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 7px 9px; box-shadow: var(--sombra); }
  .etapas i { color: var(--tenue); font-style: normal; }
  .etapas b { padding: 5px 10px; border-radius: 7px; background: #fff; border: 1px solid var(--borde); color: var(--tenue); transition: all .35s; }
  .etapas b.corriendo { border-color: var(--azul); color: var(--azul); animation: latido 1s ease-in-out infinite; }
  .etapas b.ok { background: #e3f7ec; border-color: var(--bien); color: #13784a; }
  .etapas b.mal { background: #ffeced; border-color: var(--mal); color: #b4232a; }
  .etapas b.salteado { opacity: .4; text-decoration: line-through; }
  @keyframes latido { 50% { background: #eaf1fe; } }

  /* Editor con el Jenkinsfile */
  .editor { width: 610px; background: #1e2a44; color: #dfe6f5; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(27, 37, 64, .25);
    font: 500 15px/1.6 "JetBrains Mono", monospace; text-align: left; transition: opacity .5s; }
  .editor .barra { display: flex; gap: 7px; align-items: center; padding: 10px 14px; background: #18223a; font: 600 13px Inter, sans-serif; color: #8b97b8; }
  .editor .barra i { width: 11px; height: 11px; border-radius: 50%; }
  .editor .barra span { margin-left: 8px; }
  .editor pre { margin: 0; padding: 12px 0; font: inherit; }
  .editor .linea { padding: 0 18px; white-space: pre; transition: background .45s, opacity .45s; }
  .editor.enfocado .linea { opacity: .38; }
  .editor.enfocado .linea.activa { opacity: 1; background: rgba(47, 124, 246, .28); }
  .editor .kw { color: #7cc4ff; }
  .editor .str { color: #f5c27a; }

  /* HUD y ayuda: se ocultan con H para grabar */
  #hud { position: fixed; top: 22px; left: 26px; font-size: 14px; color: var(--tenue); }
  #puntos { display: flex; gap: 6px; margin-top: 8px; }
  #puntos i { width: 22px; height: 4px; border-radius: 2px; background: rgba(91, 103, 133, .25); transition: background .3s; }
  #puntos i.hecho { background: var(--azul); }
  #ayuda { position: fixed; right: 26px; bottom: 18px; font-size: 13px; color: var(--tenue); opacity: .8; }
  body.limpio #hud, body.limpio #ayuda { display: none; }

  /* Velo para el fundido entre escenas */
  #velo { position: fixed; inset: 0; background: var(--fondo); opacity: 1; pointer-events: none; transition: opacity .45s ease; }
  #velo.abierto { opacity: 0; transition-duration: .8s; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body class="portada">
<div id="etiquetas"></div>
<div id="degradado"></div>
<aside id="panel" class="oculto"><h2></h2><ul></ul></aside>
<div id="leyenda" class="oculta"><h1></h1><p></p><div class="integrantes"></div></div>
<div id="hud"><div id="hud-escena"></div><div id="puntos"></div></div>
<div id="ayuda">Espacio / → avanzar · ← volver · 1–7 escenas · H ocultar · F pantalla completa</div>
<div id="velo"></div>

<script type="module">
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const C = {
  fondo: 0xeef2f8, piso: 0xe6ecf5, texto: 0x1b2540,
  azul: 0x2f7cf6, bien: 0x22b573, mal: 0xe5484d, ambar: 0xf5a524,
  acero: 0x6b7ca3, claro: 0xf7f9fc, gris: 0xc9d3e3, grisOscuro: 0x9aa8c4, zona: 0xdde8fa,
  dotnet: 0x512bd4, docker: 0x1d63ed, k8s: 0x326ce5, ngrok: 0x1f2440,
};
let tiempo = 0;

// ───────────────────────── Escenario común ─────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const etiquetas = new CSS2DRenderer({ element: document.getElementById('etiquetas') });
etiquetas.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.fondo);
// La niebla tiene el color del fondo: el piso se funde con el horizonte, sin borde visible.
scene.fog = new THREE.Fog(C.fondo, 20, 48);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc8d2e4, 1.6));
const sol = new THREE.DirectionalLight(0xffffff, 1.9);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.bias = -0.0005;
Object.assign(sol.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11 });
scene.add(sol, sol.target);

const piso = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ color: C.piso, roughness: 1 }));
piso.rotation.x = -Math.PI / 2;
piso.receiveShadow = true;
scene.add(piso);
const grilla = new THREE.GridHelper(160, 160, 0xd3dbe8, 0xdde4ef);
grilla.position.y = 0.002;
scene.add(grilla);

// Motas que suben despacio: dan profundidad y movimiento constante.
const motas = (() => {
  const n = 320, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 34;
    pos[i * 3 + 1] = Math.random() * 9;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 30;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ color: C.azul, size: 0.035, transparent: true, opacity: 0.35, depthWrite: false }));
  scene.add(p);
  return p;
})();

// ───────────────────────── Utilidades ─────────────────────────
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const curvas = {
  lineal: k => k,
  entrada: k => k * k,
  suave: k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  salida: k => 1 - Math.pow(1 - k, 3),
  resorte: k => 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2),
  rebote: k => {
    const n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k;
    if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375;
    return n * (k -= 2.625 / d) * k + 0.984375;
  },
};

function mat(color, { metal = 0.05, rugoso = 0.55, emisivo = 0x000000, intensidad = 0 } = {}) {
  return new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rugoso, emissive: emisivo, emissiveIntensity: intensidad });
}
// Color plano, sin sombreado: para detalles que tienen que "resaltar" (bordes, flechas, pantallas).
const plano = (color, opciones = {}) => new THREE.MeshBasicMaterial({ color, ...opciones });

function caja(w, h, d, material, redondeo = 0) {
  const geo = redondeo ? new RoundedBoxGeometry(w, h, d, 4, redondeo) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, material);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cilindro(rArriba, rAbajo, alto, material, abierto = false, lados = 48) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rArriba, rAbajo, alto, lados, 1, abierto), material);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function esfera(radio, material) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(radio, 24, 16), material);
  m.castShadow = true;
  return m;
}
// Tubo recto entre dos puntos (cables y conexiones).
function tubo(desde, hasta, radio, material) {
  const dir = hasta.clone().sub(desde);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radio, radio, dir.length(), 12), material);
  m.position.copy(desde).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
  return m;
}
// Aura suave detrás de un objeto: el "brillo" que en un fondo claro no da el bloom.
function aura(color, tam) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(color);
  const rgb = `${Math.round(col.r * 255)}, ${Math.round(col.g * 255)}, ${Math.round(col.b * 255)}`;
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, `rgba(${rgb}, .5)`);
  grad.addColorStop(1, `rgba(${rgb}, 0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.setScalar(tam);
  return s;
}
function etiqueta(html, clase = '') {
  const div = document.createElement('div');
  div.className = 'etiqueta ' + clase;
  div.innerHTML = html;
  return new CSS2DObject(div);
}
// Cambia texto y clase solo si cambiaron: se llama en cada cuadro y así no se toca el DOM de más.
function rotular(et, texto, clase = '') {
  const nombre = `etiqueta mini ${clase}`.trim();
  if (et.element.className !== nombre) et.element.className = nombre;
  if (et.element.textContent !== texto) et.element.textContent = texto;
}
// Vuelve a disparar una animación CSS (por ejemplo, el destello al cambiar de versión).
function reanimar(et, clase) {
  et.element.classList.remove(clase);
  void et.element.offsetWidth;
  et.element.classList.add(clase);
}
// Encuadre hacia un punto. Con panel, la cámara se corre a la izquierda para que
// el contenido quede en la parte derecha de la pantalla, libre del panel.
function vistaHacia(centro, distancia, { panel = true, elevacion = 0.32, giro = 0 } = {}) {
  const mira = centro.clone();
  if (panel) mira.x -= 0.255 * distancia;
  const pos = V(
    mira.x + Math.sin(giro) * Math.cos(elevacion) * distancia,
    mira.y + Math.sin(elevacion) * distancia,
    mira.z + Math.cos(giro) * Math.cos(elevacion) * distancia,
  );
  return [pos, mira];
}

// Mini motor de animaciones. En modo "instantáneo" todo salta al estado final:
// así se puede volver a un momento anterior reconstruyendo la escena sin esperar.
let tweens = [];
let instantaneo = false;
function animar({ dur = 1, demora = 0, curva = curvas.suave, inicio, paso, fin }) {
  if (instantaneo) { inicio?.(); paso?.(1); fin?.(); return; }
  tweens.push({ t: -demora, dur, curva, inicio, paso, fin, empezo: false });
}
const luego = (seg, fn) => animar({ dur: seg, fin: fn });
function actualizarTweens(dt) {
  const lista = tweens;
  for (const tw of [...lista]) {
    if (lista !== tweens) break; // se cambió de escena en medio del recorrido
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.empezo) { tw.empezo = true; tw.inicio?.(); }
    const k = Math.min(tw.t / tw.dur, 1);
    tw.paso?.(tw.curva(k));
    if (k >= 1) { lista.splice(lista.indexOf(tw), 1); tw.fin?.(); }
  }
}
// Lleva un objeto a otra posición y rotación, con un arco opcional (salto) y caída con gravedad.
function volar(obj, destino, { rot, arco = 0, gravedad = false, ...opciones } = {}) {
  let p0, r0;
  animar({
    ...opciones,
    inicio() { p0 = obj.position.clone(); r0 = obj.rotation.clone(); opciones.inicio?.(); },
    paso(k) {
      obj.position.x = lerp(p0.x, destino.x, k);
      obj.position.z = lerp(p0.z, destino.z, k);
      obj.position.y = lerp(p0.y, destino.y, gravedad ? k * k : k) + Math.sin(Math.PI * k) * arco;
      if (rot) obj.rotation.set(lerp(r0.x, rot.x ?? r0.x, k), lerp(r0.y, rot.y ?? r0.y, k), lerp(r0.z, rot.z ?? r0.z, k));
    },
  });
}
// Recorre un camino curvo (Catmull-Rom) que pasa por todos los puntos.
function recorrer(obj, puntos, opciones = {}) {
  const camino = puntos.isCurve ? puntos : new THREE.CatmullRomCurve3(puntos);
  animar({ curva: curvas.suave, ...opciones, paso: k => { obj.position.copy(camino.getPoint(k)); } });
}
function escalar(obj, hasta, opciones = {}) {
  let s0;
  animar({ ...opciones, inicio() { s0 = obj.scale.x; }, paso(k) { obj.scale.setScalar(Math.max(lerp(s0, hasta, k), 0.001)); } });
}
function colorear(material, color, opciones = {}) {
  let c0;
  const c1 = new THREE.Color(color);
  animar({ ...opciones, inicio() { c0 = material.color.clone(); }, paso(k) { material.color.lerpColors(c0, c1, k); } });
}
const mostrar = (et, demora = 0) => luego(demora, () => { if (et) et.visible = true; });

// Cámara con amortiguación tipo resorte: arranca y frena suave, sin tirones.
const cam = {
  pos: V(0, 3, 8), mira: V(0, 1, 0), suavidad: 1.1, sacudida: 0,
  base: V(0, 3, 8), miraActual: V(0, 1, 0), velPos: V(), velMira: V(),
};
function encuadrar(pos, mira, suavidad = 1.1) {
  cam.pos.copy(pos);
  cam.mira.copy(mira);
  cam.suavidad = suavidad;
}
function sacudir(fuerza) { if (!instantaneo) cam.sacudida = Math.max(cam.sacudida, fuerza); }
// SmoothDamp: el mismo algoritmo que usan los motores de juegos para seguir un objetivo.
function amortiguar(actual, objetivo, vel, t, dt) {
  const omega = 2 / t, x = omega * dt;
  const e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  for (const eje of ['x', 'y', 'z']) {
    const cambio = actual[eje] - objetivo[eje];
    const temp = (vel[eje] + omega * cambio) * dt;
    vel[eje] = (vel[eje] - omega * temp) * e;
    actual[eje] = objetivo[eje] + (cambio + temp) * e;
  }
}

// ───────────────────────── Piezas reutilizables ─────────────────────────
// La torre de control: así se dibuja el controller de Jenkins en todas las escenas.
function crearTorre() {
  const t = new THREE.Group();
  const base = cilindro(0.95, 1.05, 0.22, mat(C.gris));
  base.position.y = 0.11;
  const cuerpo = cilindro(0.45, 0.6, 2.1, mat(C.claro));
  cuerpo.position.y = 1.27;
  for (const y of [0.75, 1.25, 1.75]) {
    const r = lerp(0.6, 0.45, (y - 0.22) / 2.1) + 0.006;
    const franja = cilindro(r, r + 0.004, 0.05, plano(0xdbe7fb), true);
    franja.position.y = y;
    t.add(franja);
  }
  const cabina = cilindro(0.8, 0.7, 0.5, mat(C.azul));
  cabina.position.y = 2.55;
  const ventanas = cilindro(0.79, 0.765, 0.16, plano(0xcfe3ff), true);
  ventanas.position.y = 2.6;
  const techo = cilindro(0.2, 0.86, 0.2, mat(C.texto));
  techo.position.y = 2.9;
  const antena = cilindro(0.025, 0.025, 0.5, mat(C.texto));
  antena.position.y = 3.25;
  const luz = esfera(0.07, plano(C.mal));
  luz.position.y = 3.52;
  t.add(base, cuerpo, cabina, ventanas, techo, antena, luz);
  t.userData = { luz, destello: -10 };
  return t;
}

function crearMuro(ancho, alto) {
  const g = new THREE.Group();
  const ladrillo = mat(0xd9a48f, { rugoso: 0.9 });
  const lw = 0.4, lh = 0.2;
  const filas = Math.round(alto / lh);
  for (let f = 0; f < filas; f++) {
    for (let x = -ancho / 2 + (f % 2 ? 0 : lw / 2); x <= ancho / 2 + 0.01; x += lw) {
      const b = caja(lw - 0.025, lh - 0.025, 0.26, ladrillo);
      b.position.set(x, lh / 2 + f * lh, 0);

        s.alerta = false;
        s.tambalea = false;
        s.cinta = true;
        pila.rotation.set(0, 0, 0);
        encuadrar(...vistaCinta, 1.3);
        animar({ dur: 1.1, demora: 0.2, paso: k => { cinta.scale.x = Math.max(k, 0.001); } });
        bloques.forEach((b, i) => {
          const { m, et } = b.userData;
          m.emissiveIntensity = 0;
          et.element.classList.remove('mal');
          et.element.innerHTML = `<b>${etapas[i]}</b><span>${tareas[i].toLowerCase()}</span>`;
          // Coordenadas locales de la pila: la cinta está en z = 2.6 del mundo.
          volar(b, V(-2.4 + i * 1.2 - pila.position.x, 0.4, 2.6 - pila.position.z), {
            rot: { x: 0, y: 0, z: -2 * Math.PI }, arco: 1.4, dur: 1.4, demora: 0.3 + i * 0.15,
          });
          colorear(m, C.acero, { dur: 1.4, demora: 0.3 + i * 0.15 });
        });
        flechas.forEach((f, i) => escalar(f, 1, { dur: 0.5, demora: 2.0 + i * 0.1, curva: curvas.resorte }));
        // El commit recorre la cinta: cada estación se pone verde al procesarlo.
        luego(2.5, () => {
          s.flota = false;
          volar(commit, V(-3.3, 0.95, 2.6), {
            arco: 0.8, dur: 1.2,
            fin() {
              const recorrido = 4;
              animar({ dur: recorrido, curva: curvas.suave, paso: k => { commit.position.x = lerp(-3.3, 3.3, k); } });
              bloques.forEach((b, i) => {
                // Con la curva "suave" el cubo no va a velocidad constante: se calcula cuándo pasa por cada estación.
                const fraccion = ((-2.4 + i * 1.2) + 3.3) / 6.6;
                let bajo = 0, alto = 1;
                for (let it = 0; it < 25; it++) {
                  const medio = (bajo + alto) / 2;
                  if (curvas.suave(medio) < fraccion) bajo = medio; else alto = medio;
                }
                colorear(b.userData.m, C.bien, { dur: 0.4, demora: recorrido * bajo });
                luego(recorrido * bajo, () => b.userData.et.element.classList.add('bien'));
              });
            },
          });
        });
      },
    },
    {
      titulo: 'CI y CD',
      texto: 'Las dos mitades del pipeline.',
      panel: {
        titulo: 'Integración y entrega continua',
        puntos: [
          '<b>CI — Integración continua:</b> cada cambio se compila y se prueba automáticamente. Un error aparece en minutos, no en semanas.',
          '<b>CD — Entrega / despliegue continuo:</b> lo que pasó las pruebas se empaqueta y se despliega solo a un entorno.',
          'El resultado es un <b>artefacto</b> (en nuestro caso, una imagen Docker) que se construye una vez y se despliega igual en cualquier entorno.',
          '<b>Jenkins</b> es la herramienta que mueve esta cinta.',
        ],
      },
      accion() {
        encuadrar(...vistaCiCd);
        llaves.forEach(({ grupo, et }, i) => {
          animar({ dur: 0.8, demora: 0.4 + i * 0.5, curva: curvas.salida, paso: k => { grupo.scale.x = Math.max(k, 0.001); } });
          mostrar(et, 1.1 + i * 0.5);
        });
      },
    },
  ];

  function actualizar(dt, t) {
    if (s.orbitando) {
      s.orbita += dt * 0.06;
      cam.pos.copy(posOrbita(s.orbita));
    }
    brazos.forEach((h, lado) => {
      h.rotation.x = 1.02 + (s.tipeando ? Math.sin(t * 18 + lado * 1.7) * 0.05 : 0);
    });
    vapor.forEach((v, i) => {
      const k = (t * 0.35 + i / 3) % 1;
      v.position.set(-0.62 + Math.sin(k * 6 + i) * 0.02, 0.92 + k * 0.28, 0.12);
      v.material.opacity = 0.7 * (1 - k);
      v.scale.setScalar(0.6 + k);
    });
    if (s.cinta) rodillos.forEach(r => { r.rotation.y -= dt * 4; });
    commit.rotation.y += dt * 0.8;
    if (s.flota) commit.position.y = 1.5 + Math.sin(t * 2) * 0.05;
    if (s.tambalea) {
      const amp = 0.006 * s.altura * s.amp;
      pila.rotation.z = Math.sin(t * 2.4) * amp;
      pila.rotation.x = Math.sin(t * 1.9 + 1) * amp * 0.6;
    }
    if (s.alerta) {
      const m = bloques[1].userData.m;
      m.color.setHex(C.mal);
      m.emissiveIntensity = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t * 10));
    }
  }

  return { grupo: g, pasos, actualizar };
}

        animar({ dur: 0.7, demora: 0.8, paso: k => { cable.scale.y = Math.max(k, 0.001); } });
        mostrar(etDisco, 1.1);

function resaltarGroovy(linea) {
  return linea.split(/('[^']*')/).map(parte => (parte.startsWith("'")
    ? `<span class="str">${parte}</span>`
    : parte.replace(/\b(pipeline|agent|any|triggers|stages|stage|steps|post|success|failure|docker|image|sh|githubPush|pollSCM)\b/g, '<span class="kw">$1</span>'))).join('');
}
function crearEditor() {
  const div = document.createElement('div');
  div.className = 'editor';
  div.innerHTML = '<div class="barra"><i style="background:#e5484d"></i><i style="background:#f5a524"></i><i style="background:#22b573"></i><span>Jenkinsfile</span></div><pre>'
    + JENKINSFILE.map(([l, grupo]) => `<div class="linea" data-grupo="${grupo}">${resaltarGroovy(l)}</div>`).join('') + '</pre>';
  const obj = new CSS2DObject(div);
  obj.userData.resaltar = grupo => {
    div.classList.toggle('enfocado', !!grupo);
    div.querySelectorAll('.linea').forEach(l => l.classList.toggle('activa', l.dataset.grupo === grupo));

  return obj;
}

  etTorre.position.set(-1.0, 3.35, -0.3);
  g.add(puesto, torre, etTorre);

  const sdk = crearContenedor({ ancho: 1.1, alto: 0.7, color: C.dotnet, html: '<b>dotnet/sdk</b><span>agente efímero</span>' });
  sdk.position.set(1.2, 0, 0.3);
  sdk.scale.setScalar(0.001);
  sdk.userData.et.visible = false;
  const barra = barraProgreso(0.9);
  barra.position.set(-0.45, 0.14, 0.31);
  sdk.add(barra);
  g.add(sdk);

  const imagen = crearImagen([['', C.grisOscuro], ['', C.dotnet], ['', C.azul]], {
    ancho: 0.9, alto: 0.22, oculta: !imagenLista, html: `<b>hola-mundo:${version}</b><span>imagen Docker</span>`,
  });
  imagen.position.set(3.3, 0, 0.3);
  g.add(imagen);

  const staging = crearContenedor({ ancho: 1.2, alto: 0.8, color: C.bien, html: '<b>hola-mundo-staging</b><span>puerto 8081</span>' });
  staging.position.set(5.5, 0, 0.3);
  const brilloStaging = aura(C.bien, 2.6);
  brilloStaging.position.set(5.5, 0.5, 0.3);
  const json = etiqueta(jsonStaging(version), 'codigo');
  json.position.set(5.5, 1.85, 0.3);
  g.add(staging, brilloStaging, json);

  const etapas = crearEtapas();
  etapas.position.set(1.4, 0.05, 2.75);
  g.add(etapas);

  const sobre = crearSobre();
  const paquete = caja(0.18, 0.18, 0.18, mat(C.azul, { emisivo: C.azul, intensidad: 0.3 }), 0.03);
  paquete.visible = false;
  const sonda = esfera(0.09, plano(C.ambar));
  sonda.add(aura(C.ambar, 0.7));
  const etSonda = etiqueta('curl', 'mini codigo');
  etSonda.position.y = 0.26;
  sonda.add(etSonda);
  sonda.visible = etSonda.visible = false;
  g.add(sobre, paquete, sonda);

  const caminos = {
    push: [V(-2.6, 1.1, 1.6), V(-3.75, 3.4, 1.2), V(-5.4, 3.2, 0.6), V(-6.2, 2.6, 0.2)],
    webhook: [V(-6.0, 1.9, -0.6), ...puntosTunel, V(-2.0, 1.5, -0.9), V(-1.0, 2.2, -0.3)],
    aSdk: [V(-1.0, 2.0, -0.3), V(0.1, 2.4, 0), V(1.2, 1.0, 0.3)],
    aStaging: [V(3.3, 1.0, 0.3), V(4.4, 2.1, 0.3), V(5.5, 1.0, 0.3)],
    smoke: [V(-1.0, 2.2, -0.3), V(2.2, 3.8, 0), V(5.5, 1.3, 0.3)],
  };
  const sdkEt = sdk.userData.et;
  const marcar = etapas.userData.marcar;

  // Acciones del pipeline. Cada una recibe "fin" para encadenar la siguiente.
  const acciones = {
    push(commit, { dur = 2, fin } = {}) {
      commit.position.copy(caminos.push[0]);
      commit.visible = true;
      escalar(commit, 1, { dur: 0.5, curva: curvas.resorte });
      mostrar(commit.userData.et, 0.3);
      recorrer(commit, caminos.push, { dur, demora: 0.5, fin });
    },
    webhook({ dur = 2.6, fin } = {}) {
      sobre.visible = sobre.userData.et.visible = true;
      recorrer(sobre, caminos.webhook, {
        dur,
        fin() {
          sobre.visible = sobre.userData.et.visible = false;
          destellar(torre);
          marcar(0, 'ok');
          fin?.();
        },
      });
    },
    buildTest({ falla = false, r = 1, fin } = {}) {
      marcar(1, 'corriendo');
      sdkEt.element.className = 'etiqueta';
      sdkEt.element.innerHTML = '<b>dotnet/sdk</b><span>Build…</span>';
      sdk.userData.material.color.setHex(C.dotnet);
      barra.scale.x = 0.001;
      escalar(sdk, 1, { dur: 0.6 * r, curva: curvas.resorte });
      mostrar(sdkEt, 0.4 * r);
      paquete.visible = true;
      paquete.position.copy(caminos.aSdk[0]);
      recorrer(paquete, caminos.aSdk, { dur: 1.0 * r, fin() { paquete.visible = false; } });
      progreso(barra, 1, { dur: 1.2 * r, demora: 1.0 * r, curva: curvas.lineal });
      luego(2.3 * r, () => {
        marcar(1, 'ok');
        marcar(2, 'corriendo');
        sdkEt.element.innerHTML = '<b>dotnet/sdk</b><span>Test…</span>';
        barra.scale.x = 0.001;
      });
      progreso(barra, falla ? 0.7 : 1, { dur: 1.2 * r, demora: 2.4 * r, curva: curvas.lineal });
      luego(3.7 * r, () => {
        if (falla) {
          colorear(sdk.userData.material, C.mal, { dur: 0.4 });
          sdkEt.element.className = 'etiqueta mal';
          sdkEt.element.innerHTML = '<b>✗ 1 test falló</b><span>esperaba "dev", llegó "desarrollo"</span>';
          marcar(2, 'mal');
          [3, 4, 5].forEach(i => marcar(i, 'salteado'));
          sacudir(0.06);
          fin?.();
          return;
        }
        sdkEt.element.className = 'etiqueta bien';
        sdkEt.element.innerHTML = '<b>✓ 3/3 tests</b><span>reporte JUnit publicado</span>';
        marcar(2, 'ok');
        // Efímero: terminado el trabajo, el contenedor se borra.
        luego(0.9 * r, () => { sdkEt.visible = false; escalar(sdk, 0.001, { dur: 0.4, curva: curvas.entrada }); });
        luego(1.0 * r, () => fin?.());
      });
    },
    imagen(v, { fin } = {}) {
      marcar(3, 'corriendo');
      imagen.userData.et.element.innerHTML = `<b>hola-mundo:${v}</b><span>+ etiqueta del commit</span>`;
      const lista = imagen.userData.losas[0].visible;
      if (lista) {
        imagen.userData.losas.forEach((l, i) => volar(l, V(0, l.userData.y, 0), { arco: 0.25, dur: 0.5, demora: i * 0.12 }));
        reanimar(imagen.userData.et, 'destello');
      } else {
        apilar(imagen);
      }
      luego(lista ? 0.9 : 1.6, () => { marcar(3, 'ok'); fin?.(); });
    },
    deploy(v, { fin } = {}) {
      marcar(4, 'corriendo');
      staging.userData.et.visible = false;
      escalar(staging, 0.001, { dur: 0.4, curva: curvas.entrada });
      json.element.style.opacity = 0.35;
      paquete.visible = true;
      paquete.position.copy(caminos.aStaging[0]);
      recorrer(paquete, caminos.aStaging, {
        dur: 1.1, demora: 0.3,
        fin() {
          paquete.visible = false;
          escalar(staging, 1, { dur: 0.6, curva: curvas.resorte });
          mostrar(staging.userData.et, 0.4);
          json.element.innerHTML = jsonStaging(v);
          json.element.style.opacity = 1;
          reanimar(json, 'destello');
          marcar(4, 'ok');
          fin?.();
        },
      });
    },
    smoke({ fin } = {}) {
      marcar(5, 'corriendo');
      json.element.classList.remove('bien');
      sonda.visible = etSonda.visible = true;
      sonda.position.copy(caminos.smoke[0]);
      recorrer(sonda, caminos.smoke, {
        dur: 1.4,
        fin() {
          json.element.classList.add('bien');
          reanimar(json, 'destello');
          recorrer(sonda, [...caminos.smoke].reverse(), {
            dur: 1.0,
            fin() { sonda.visible = etSonda.visible = false; marcar(5, 'ok'); destellar(torre); fin?.(); },
          });
        },
      });
    },
  };

  return { torre, staging, brilloStaging, json, etapas, imagen, sdk, acciones };
}

function crearEscena6() {
  const g = new THREE.Group();
  const c = crearCircuito(g, { version: 17, imagenLista: true });
  c.etapas.userData.todas('ok');
  const bug = crearCommit('<b>commit</b> 9b5a5db 🐞', C.ambar);
  const revert = crearCommit('<b>Revert</b> 593eb14', C.azul);
  for (const m of [bug, revert]) {
    m.visible = false;
    m.scale.setScalar(0.001);
    m.userData.et.visible = false;
    g.add(m);
  }

  // La barrera: el quality gate entre Test y el resto del pipeline
  const barrera = new THREE.Group();
  barrera.position.set(2.25, 0, 1.55);
  const poste = caja(0.12, 1.0, 0.12, mat(C.texto), 0.02);
  poste.position.y = 0.5;

  brazo.position.y = 0.95;
  for (let i = 0; i < 6; i++) {
    const segmento = caja(0.08, 0.34, 0.08, mat(i % 2 ? 0xffffff : C.mal), 0.01);
    segmento.position.y = 0.17 + i * 0.34;
    brazo.add(segmento);

  etBarrera.position.set(2.25, 1.55, 0.6);
  etBarrera.visible = false;
  g.add(barrera, etBarrera);
  const bajarBarrera = (abajo, opciones = {}) => {
    let r0;
    animar({ dur: 0.9, curva: abajo ? curvas.rebote : curvas.suave, ...opciones, inicio() { r0 = brazo.rotation.x; }, paso: k => { brazo.rotation.x = lerp(r0, abajo ? -Math.PI / 2 : 0, k); } });
  };

  encuadrar(...vistaHacia(V(-3.4, 1.4, 0.4), 8.5, { panel: false }));

  const pasos = [
    {
      titulo: 'Alguien rompe algo',
      texto: 'Un cambio con un bug llega al repositorio, como cualquier otro.',
      accion() {
        c.etapas.userData.todas('');
        c.acciones.push(bug, {
          dur: 1.8,
          fin() { bug.userData.et.visible = false; c.acciones.webhook({ dur: 2.4 }); },
        });
      },
    },
    {
      titulo: 'El test falla',
      texto: 'El pipeline se corta: no se construye la imagen ni se despliega nada.',
      accion() {
        encuadrar(...vistaHacia(V(1.3, 1.1, 0.5), 7.2, { panel: false }));
        c.acciones.buildTest({
          falla: true,
          fin() {
            bajarBarrera(true);
            mostrar(etBarrera, 0.6);
          },
        });
      },
    },
    {
      titulo: 'Staging intacto',
      texto: 'Sigue respondiendo con la versión 17, la última que pasó todas las pruebas.',
      panel: {
        titulo: 'El test como quality gate',
        puntos: [
          'Un test fallido deja el build en <b>rojo</b> y corta los stages siguientes.',
          'No hay imagen nueva ni deploy: staging conserva la <b>última versión buena</b>.',
          'El equipo se entera por el build rojo, con el reporte del test que falló.',
          'En ADO es lo mismo: los stages siguientes tienen <code>condition: succeeded()</code> por defecto.',
        ],
      },
      accion() {
        encuadrar(...vistaHacia(V(4.4, 1.1, 0.4), 8));
        reanimar(c.json, 'destello');
      },
    },
    {
      titulo: 'Se corrige con otro commit',
      texto: 'git revert: el pipeline vuelve a pasar y despliega solo. La versión 18 nunca llegó a staging.',
      accion() {
        etBarrera.visible = false;
        encuadrar(...vistaHacia(V(0.6, 1.2, 0.3), 13, { panel: false }));
        escalar(c.sdk, 0.001, { dur: 0.3 });
        c.sdk.userData.et.visible = false;
        c.etapas.userData.todas('');
        c.acciones.push(revert, {
          dur: 1.4,
          fin() {
            revert.userData.et.visible = false;
            c.acciones.webhook({
              dur: 1.8,
              fin() {
                c.acciones.buildTest({
                  r: 0.6,
                  fin() {
                    bajarBarrera(false);
                    c.acciones.imagen(19, { fin() { c.acciones.deploy(19, { fin() { c.acciones.smoke(); } }); } });

                });
              },
            });
          },
        });
      },
    },
  ];

  function actualizar(dt, t) {

  return { grupo: g, pasos, actualizar };
}

    const p = new THREE.Group();
    p.position.set(x, 0, 0);
    const columna = cilindro(0.7, 0.78, 1.2, mat(C.claro));
    columna.position.y = 0.6;
    const aro = cilindro(0.712, 0.712, 0.07, plano(color), true);
    aro.position.y = 1.12;
    p.add(columna, aro);
    let icono;
    if (i === 0) {
      icono = crearTorre();
      icono.scale.setScalar(0.4);
      icono.position.y = 1.2;
    } else if (i === 1) {
      icono = caja(0.7, 0.7, 0.7, mat(color), 0.12);
      icono.position.y = 1.65;
    } else {
      icono = new THREE.Group();
      icono.add(esfera(0.4, mat(color)));
      const play = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.26, 3), plano(0xffffff));
      play.rotation.z = -Math.PI / 2;
      play.position.z = 0.38;
      icono.add(play);
      icono.position.y = 1.65;
    }
    p.add(icono);
    p.userData.icono = icono;
    p.scale.set(1, 0.001, 1);
    const et = etiqueta(html);
    et.position.set(x, 2.75, 0);
    et.visible = false;
    g.add(p, et);
    return { p, et };
  });

  const final = crearCommit('<b>git push</b>');
  final.position.set(ZB, 4.0, 0);
  final.scale.setScalar(0.001);
  final.userData.et.visible = false;
  g.add(final);

  encuadrar(...vistaHacia(V(0, 1.0, 0), 10.5, { panel: false }));

  const pasos = [
    {
      titulo: 'Del laboratorio a una empresa',
      texto: 'Lo que armamos es chico, pero tiene la forma de un sistema real.',
      accion() {
        piezas.forEach(({ a, et }, i) => {
          escalar(a, 1, { dur: 0.6, demora: 0.3 + i * 0.2, curva: curvas.resorte });
          mostrar(et, 0.7 + i * 0.2);
        });
      },
    },
    {
      titulo: 'Escalar no es un salto grande',
      texto: 'Cada pieza tiene su equivalente, y el pipeline casi no cambia.',
      panel: {
        titulo: 'Qué cambia al escalar',
        puntos: [
          'Imagen local → <b>registry</b>: un <code>docker push</code> más y una credencial.',
          'Contenedor staging → <b>Kubernetes</b> o App Service: cambia solo la etapa de deploy.',
          'Túnel → Jenkins con <b>URL pública</b>: el pipeline no cambia.',
          "Un nodo → <b>controller + agentes</b>: <code>agent { label '…' }</code>.",
          'Configuración por UI → <b>JCasC</b> y <code>plugins.txt</code> versionados.',
        ],
      },
      accion() {
        encuadrar(...vistaHacia(V(0, 1.0, 0), 11.5));
        piezas.forEach(({ a, d, et }, i) => {
          const demora = 0.6 + i * 0.6;
          escalar(a, 0.001, { dur: 0.35, demora, curva: curvas.entrada });
          escalar(d, 1, { dur: 0.7, demora: demora + 0.3, curva: curvas.resorte });
          luego(demora + 0.3, () => {
            et.element.innerHTML = `<b>${nombresDespues[i][0]}</b><span>${nombresDespues[i][1]}</span>`;
            reanimar(et, 'destello');
          });
        });
      },
    },
    {
      titulo: 'Jenkins, ADO o GitHub Actions',
      texto: 'Los conceptos son los mismos; cambia quién opera la infraestructura.',
      panel: {
        titulo: '¿Cuándo conviene cada uno?',
        puntos: [
          '<b>Jenkins</b> conviene con infraestructura propia (on-premise), requisitos especiales o muchas integraciones a medida.',
          'Su costo es operarlo: actualizaciones, plugins, backups y seguridad quedan a cargo del equipo.',
          '<b>ADO y GitHub Actions</b> resuelven la infraestructura (agentes, URL pública, actualizaciones) a cambio de menos control y costo por uso.',
          'Pipeline como código, agentes, stages y triggers: saber uno es saber los otros.',
        ],
      },
      accion() {
        encuadrar(...vistaHacia(V(ZB, 1.5, 0), 9));
        pilares.forEach(({ p, et }, i) => {
          animar({ dur: 0.9, demora: 0.5 + i * 0.35, curva: curvas.salida, paso: k => { p.scale.y = Math.max(k, 0.001); } });
          mostrar(et, 1.2 + i * 0.35);
        });
      },
    },
    {
      titulo: 'Ahora, <em>la práctica</em>',
      texto: 'El mismo pipeline, funcionando de verdad.',
      portada: true,
      accion() {
        pilares.forEach(({ et }) => { et.visible = false; });
        encuadrar(...vistaHacia(V(ZB, 2.7, 0), 8.5, { panel: false, elevacion: 0.18 }));
        escalar(final, 2.2, { dur: 0.9, demora: 0.4, curva: curvas.resorte });
        luego(0.6, () => {
          const colores = [C.azul, C.bien, C.ambar, C.mal, C.dotnet, 0x7cc4ff];
          for (let i = 0; i < 160; i++) {
            const pieza = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 0.05), plano(colores[i % colores.length]));
            pieza.position.set(ZB + (Math.random() - 0.5) * 10, 5 + Math.random() * 5, (Math.random() - 0.5) * 5);
            pieza.userData = {
              vel: V((Math.random() - 0.5) * 0.4, -0.6 - Math.random() * 0.8, (Math.random() - 0.5) * 0.4),
              giro: V(Math.random() * 6, Math.random() * 6, Math.random() * 6),
            };
            g.add(pieza);
            s.confeti.push(pieza);
          }
        });
      },
    },
  ];

  function actualizar(dt, t) {
    piezas.forEach(({ d }) => { if (d.userData.gira) d.userData.gira.rotation.y += dt * 0.6; });
    pilares.forEach(({ p }, i) => {
      if (p.userData.icono) p.userData.icono.rotation.y = Math.sin(t * 0.8 + i) * 0.4;
    });
    final.rotation.y += dt * 0.9;
    final.position.y = 4.0 + Math.sin(t * 1.8) * 0.08;
    for (const pieza of s.confeti) {
      if (pieza.position.y <= 0.02) continue;
      const { vel, giro } = pieza.userData;
      pieza.position.addScaledVector(vel, dt);
      pieza.position.x += Math.sin(t * 3 + pieza.id) * dt * 0.3;
      pieza.rotation.x += giro.x * dt;
      pieza.rotation.y += giro.y * dt;
      pieza.rotation.z += giro.z * dt;
      if (pieza.position.y < 0.02) { pieza.position.y = 0.02; pieza.rotation.set(-Math.PI / 2, 0, pieza.rotation.z); }
    }
  }

  return { grupo: g, pasos, actualizar };
}

const ESCENAS = [
  { nombre: 'El problema', crear: crearEscena1 },
  { nombre: 'Jenkins por dentro', crear: crearEscena2 },
  { nombre: 'Agentes y Docker', crear: crearEscena3 },
  { nombre: 'Pipeline como código', crear: crearEscena4 },
  { nombre: 'El viaje de un commit', crear: crearEscena5 },
  { nombre: 'El pipeline protege', crear: crearEscena6 },
  { nombre: 'Escalar y comparar', crear: crearEscena7 },
];

// ───────────────────────── Navegación ─────────────────────────
const $leyenda = document.getElementById('leyenda');
const $panel = document.getElementById('panel');
const $velo = document.getElementById('velo');
let iEscena = 0, iPaso = 0, actual = null, idTexto = 0, ocupado = false;

function mostrarTextos({ titulo, texto, portada = false, integrantes, panel }) {
  const id = ++idTexto;
  $leyenda.classList.add('oculta');
  $panel.classList.add('oculto');
  setTimeout(() => {
    if (id !== idTexto) return;
    document.body.classList.toggle('portada', !!portada);
    document.body.classList.toggle('arriba', portada === 'arriba');
    $leyenda.querySelector('h1').innerHTML = titulo;
    $leyenda.querySelector('p').textContent = texto;
    const $integrantes = $leyenda.querySelector('.integrantes');
    $integrantes.innerHTML = (integrantes ?? []).map(([nombre, lu]) => `<div>${nombre}<span>LU ${lu}</span></div>`).join('');
    $integrantes.classList.toggle('visible', !!integrantes);
    $leyenda.classList.remove('oculta');
    if (panel) {
      $panel.querySelector('h2').textContent = panel.titulo;
      // Cada punto entra un poco después del anterior, para poder narrarlos de a uno.
      $panel.querySelector('ul').innerHTML = panel.puntos
        .map((p, i) => `<li style="animation-delay:${0.5 + i * 0.6}s">${p}</li>`).join('');
      $panel.classList.remove('oculto');
    }
  }, 420);
}

function actualizarHud() {
  document.getElementById('hud-escena').textContent = `Escena ${iEscena + 1} / ${ESCENAS.length} · ${ESCENAS[iEscena].nombre}`;
  document.getElementById('puntos').innerHTML = actual.pasos.map((_, i) => `<i class="${i <= iPaso ? 'hecho' : ''}"></i>`).join('');
}

function ejecutarPaso() {
  const paso = actual.pasos[iPaso];
  mostrarTextos(paso);
  paso.accion?.();
  actualizarHud();
}

// Para ir a un momento: se reconstruye la escena, los momentos anteriores se aplican
// al instante y el pedido se anima. Así "volver" siempre deja la escena coherente.
function montar(escena, paso, escenaNueva) {
  tweens = [];
  if (actual) {
    scene.remove(actual.grupo);
    actual.grupo.traverse(o => { if (o.isCSS2DObject) o.element.remove(); });
  }
  iEscena = escena;
  actual = ESCENAS[escena].crear();
  scene.add(actual.grupo);
  iPaso = paso < 0 ? actual.pasos.length - 1 : paso;
  instantaneo = true;
  for (let p = 0; p < iPaso; p++) actual.pasos[p].accion?.();
  instantaneo = false;
  if (escenaNueva) {
    // Con el velo cerrado, la cámara salta directo al encuadre de la escena nueva.
    cam.base.copy(cam.pos);
    cam.miraActual.copy(cam.mira);
    cam.velPos.set(0, 0, 0);
    cam.velMira.set(0, 0, 0);
  }
  ejecutarPaso();
}

function irA(escena, paso, { fundido = false } = {}) {
  if (!fundido) return montar(escena, paso, false);
  ocupado = true;
  $velo.classList.remove('abierto');
  $leyenda.classList.add('oculta');
  $panel.classList.add('oculto');
  setTimeout(() => {
    montar(escena, paso, true);
    $velo.classList.add('abierto');
    ocupado = false;
  }, 480);
}

function avanzar() {
  if (iPaso < actual.pasos.length - 1) { iPaso++; ejecutarPaso(); }
  else if (iEscena < ESCENAS.length - 1) irA(iEscena + 1, 0, { fundido: true });
}
function retroceder() {
  if (iPaso > 0) irA(iEscena, iPaso - 1);
  else if (iEscena > 0) irA(iEscena - 1, -1, { fundido: true });
}

addEventListener('keydown', e => {
  if (e.code === 'KeyH') return document.body.classList.toggle('limpio');
  if (e.code === 'KeyF') return document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (ocupado || !actual) return;
  if (['Space', 'ArrowRight', 'PageDown'].includes(e.code)) { e.preventDefault(); avanzar(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.code)) { e.preventDefault(); retroceder(); }
  else if (e.code === 'KeyR') irA(iEscena, 0);
  else if (/^Digit[1-7]$/.test(e.code)) irA(Number(e.code.slice(-1)) - 1, 0, { fundido: true });
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  etiquetas.setSize(innerWidth, innerHeight);
});

// ───────────────────────── Bucle principal ─────────────────────────
const reloj = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(reloj.getDelta(), 1 / 20);
  tiempo += dt;
  actualizarTweens(dt);
  actual?.actualizar?.(dt, tiempo);

  const pos = motas.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, (pos.getY(i) + dt * 0.08) % 9);
  pos.needsUpdate = true;

  amortiguar(cam.base, cam.pos, cam.velPos, cam.suavidad, dt);
  amortiguar(cam.miraActual, cam.mira, cam.velMira, cam.suavidad, dt);
  // Balanceo leve y constante: la imagen nunca queda congelada.
  camera.position.set(
    cam.base.x + Math.sin(tiempo * 0.31) * 0.12,
    cam.base.y + Math.sin(tiempo * 0.23) * 0.06,
    cam.base.z,
  );
  if (cam.sacudida > 0.001) {
    camera.position.x += (Math.random() - 0.5) * cam.sacudida;
    camera.position.y += (Math.random() - 0.5) * cam.sacudida;
    cam.sacudida *= Math.exp(-dt * 7);
  }
  camera.lookAt(cam.miraActual);
  // El sol y su sombra acompañan a la cámara: las escenas están en zonas distintas del piso.
  sol.target.position.set(cam.miraActual.x, 0, cam.miraActual.z);
  sol.position.set(cam.miraActual.x + 5, 10, cam.miraActual.z + 6);
  motas.position.x = cam.miraActual.x;

  renderer.render(scene, camera);
  etiquetas.render(scene, camera);
});

irA(0, 0, { fundido: true });
</script>
