# Jenkins local para el laboratorio de CI/CD.
# Levantar desde esta carpeta con: docker compose up -d
services:
  jenkins:
    # Imagen propia (infra/jenkins/Dockerfile): la oficial LTS + Docker CLI + plugins.txt.
    # Se construye con "docker compose build"; "image" le pone nombre a lo que se construye.
    build: ./jenkins
    image: jenkins-hola-mundo:local
    container_name: jenkins
    # Si se reinicia Docker Desktop, Jenkins vuelve solo (salvo que lo frenemos a mano).
    restart: unless-stopped
    ports:
      - "8080:8080"     # UI web
      - "50000:50000"   # conexión de agentes inbound (se usa en el extra 10c)
    volumes:
      # JENKINS_HOME guarda TODO el estado del controller: jobs, builds, plugins, usuarios.
      # Va en un volumen para que sobreviva a borrar y recrear el contenedor.
      - jenkins_home:/var/jenkins_home
      # Socket del daemon de Docker de la PC: con esto el CLI de Jenkins maneja ese daemon,
      # y los contenedores que lance nacen AL LADO de Jenkins, no adentro.
      # RIESGO: quien usa este socket controla todo el Docker de la PC (equivale a ser root).
      # Aceptable en el laboratorio; en una empresa se usan agentes aislados.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # El socket es srw-rw---- de root:root (GID 0) en Docker Desktop. Sumar a "jenkins" a ese
      # grupo le da acceso al socket sin correr Jenkins como root.
      # En un Linux nativo suele ser el grupo "docker" (otro GID): DOCKER_GID=<gid> docker compose up -d
      - "${DOCKER_GID:-0}"
    networks:
      - ci-local

  tunel:
    # Túnel público hacia Jenkins: la PC está detrás de NAT y GitHub no puede llegar a ella
    # para mandar el webhook. ngrok da una URL pública fija y reenvía lo que llega por el túnel.
    image: ngrok/ngrok:latest
    container_name: tunel-ngrok
    # Solo arranca con "docker compose --profile tunel up -d": quien no configuró ngrok
    # puede levantar Jenkins igual.
    profiles: ["tunel"]
    restart: unless-stopped
    # Token y dominio vienen de infra/.env (no se versiona; ver .env.example).
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # "jenkins:8080": por la red ci-local, el túnel llega a Jenkins por nombre.
    # --log stdout: sin una terminal interactiva ngrok no muestra nada; así sus logs salen en "docker logs".
    command: http jenkins:8080 --url ${NGROK_URL} --traffic-policy-file /etc/ngrok/politica.yml --log stdout
    volumes:
      - ./ngrok/politica.yml:/etc/ngrok/politica.yml:ro
    ports:
      - "4040:4040"   # inspector local: muestra cada request que entra por el túnel
    networks:
      - ci-local
    depends_on:
      - jenkins

networks:
  # Red compartida con los contenedores que lanza el pipeline (staging): así Jenkins les habla
  # por nombre (http://hola-mundo-staging:8080). Dentro de un contenedor, "localhost" es él mismo.
  # external: se crea una vez a mano (docker network create ci-local). Si la creara Compose,
  # un "down" intentaría borrarla mientras staging sigue conectado.
  ci-local:
    external: true

volumes:
  jenkins_home:
    # Nombre fijo: sin esto, Compose lo llamaría "infra_jenkins_home" (prefijo de la carpeta).
    name: jenkins_home
