# Política del túnel: el túnel expone Jenkins a internet, pero GitHub solo necesita
# /github-webhook/. Todo lo demás (la UI, el login, la API) responde 404 sin llegar a Jenkins.
on_http_request:
  - expressions:
      - "!req.url.path.startsWith('/github-webhook')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "No disponible"
